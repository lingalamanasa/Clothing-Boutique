<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 110" width="420" height="110" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5DEB3" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E2E8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Diamond Atelier Emblem -->
  <g transform="translate(10, 10)">
    <polygon points="45,5 85,45 45,85 5,45" stroke="url(#goldGrad)" stroke-width="2.5" fill="rgba(212, 175, 55, 0.08)" />
    <polygon points="45,18 72,45 45,72 18,45" stroke="url(#goldGrad)" stroke-width="1.2" stroke-dasharray="2,2" fill="none" />
    
    <!-- Central Interlocking S Monogram -->
    <path d="M 52,32 C 48,27 38,27 34,33 C 30,39 34,46 45,49 C 56,52 60,60 56,66 C 52,72 40,73 35,67" 
          stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <circle cx="45" cy="18" r="2" fill="#D4AF37" />
    <circle cx="45" cy="72" r="2" fill="#D4AF37" />
    <circle cx="18" cy="45" r="2" fill="#D4AF37" />
    <circle cx="72" cy="45" r="2" fill="#D4AF37" />
  </g>

  <!-- STACKLY Wordmark -->
  <g transform="translate(110, 20)">
    <text x="0" y="46" font-family="'Cinzel', 'Playfair Display', 'Didot', 'Georgia', serif" font-size="44" font-weight="700" letter-spacing="5" fill="url(#textGrad)">STACKLY</text>
    <!-- Subtitle -->
    <text x="3" y="66" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="10" font-weight="600" letter-spacing="6" fill="#D4AF37">HAUTE COUTURE &amp; ATELIER</text>
    <!-- Thin divider line -->
    <line x1="3" y1="74" x2="285" y2="74" stroke="url(#goldGrad)" stroke-width="1" opacity="0.6" />
  </g>
</svg>
