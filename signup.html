<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create an account | STACKLY Sign Up</title>
  <meta name="description" content="Sign up and get a 30 day free trial with STACKLY." />
  <link rel="icon" href="./favicon.webp" type="image/webp" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  
  <link rel="stylesheet" href="./css/auth-dash.css" />
  <link rel="stylesheet" href="./css/responsive.css" />
</head>

<body class="auth-body">
  <main class="auth-container">
    <!-- LEFT SIDE: FORM (Screenshot 2) -->
    <section class="auth-form-side">
      <div>
        <!-- Top Navigation -->
        <div class="auth-nav-row">
          <a href="index.html" class="brand-pill" aria-label="STACKLY Home">
            <img src="./images/logo-pink.webp" alt="STACKLY" style="height: 24px; width: auto; display: block;" />
          </a>
          <a href="index.html" class="back-home-btn">
            <span>&larr;</span> Back to home
          </a>
        </div>

        <!-- Heading -->
        <h1 class="auth-heading">Create an account</h1>
        <p class="auth-subheading">Sign up and get 30 day free trial</p>

        <!-- Signup Form -->
        <form id="signup-form" class="auth-fields-wrap" onsubmit="handleSignup(event)">
          <!-- Username / Full Name -->
          <div class="field-group">
            <label for="fullname" class="field-label">Username / Full Name</label>
            <div class="input-container">
              <input type="text" id="fullname" name="fullname" class="auth-input" placeholder="Enter your name or username" required autocomplete="name" />
            </div>
          </div>

          <!-- Email -->
          <div class="field-group">
            <label for="email" class="field-label">Email</label>
            <div class="input-container">
              <input type="email" id="email" name="email" class="auth-input" placeholder="Enter your email address" required autocomplete="email" />
            </div>
          </div>

          <!-- Password -->
          <div class="field-group">
            <label for="signup-password" class="field-label">Password</label>
            <div class="input-container">
              <input type="password" id="signup-password" name="password" class="auth-input" placeholder="Enter your password" required autocomplete="new-password" />
              <button type="button" class="eye-btn" aria-label="Toggle password visibility" onclick="togglePasswordVisibility('signup-password', this)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>
          </div>

          <!-- Confirm Password -->
          <div class="field-group">
            <label for="confirm-password" class="field-label">Confirm Password</label>
            <div class="input-container">
              <input type="password" id="confirm-password" name="confirm_password" class="auth-input" placeholder="Confirm your password" required autocomplete="new-password" />
              <button type="button" class="eye-btn" aria-label="Toggle confirm password visibility" onclick="togglePasswordVisibility('confirm-password', this)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>
          </div>

          <!-- Role Dropdown -->
          <div class="field-group">
            <label for="signup-role-select" class="field-label">Role</label>
            <div class="select-container">
              <select id="signup-role-select" name="role" class="auth-select">
                <option value="user">Client / VIP Member (Atelier Suite)</option>
                <option value="admin">Boutique Director (Admin Studio)</option>
              </select>
              <svg class="select-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </div>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="auth-submit-btn" id="signup-submit-btn">Submit</button>

          <!-- Social Buttons -->
          <div class="auth-social-row">
            <button type="button" class="social-btn" onclick="socialAuth('GitHub')">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
              </svg>
              <span>GitHub</span>
            </button>
            <button type="button" class="social-btn" onclick="socialAuth('Google')">
              <svg width="18" height="18" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
                <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.36 24 12 24z"/>
                <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 10.04 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
                <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.36 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
              </svg>
              <span>Google</span>
            </button>
          </div>
        </form>
      </div>

      <!-- Footers -->
      <footer class="auth-footer">
        <div class="auth-footer-text">
          Have any account? <a href="login.html" class="auth-footer-link">Sign in</a>
        </div>
      </footer>
    </section>

    <!-- RIGHT SIDE: VISUAL SHOWCASE (Boutique Showroom) -->
    <aside class="auth-showcase-side" aria-label="Haute Couture Showroom Showcase">
      <img src="./images/auth-signup-fashion.webp" alt="STACKLY Haute Couture Fashion Showroom" class="showcase-bg-img" />
      <div class="showcase-gradient-overlay"></div>

      <!-- Top Floating Task Card -->
      <div class="task-widget-card">
        <div class="task-widget-head">
          <span class="task-widget-title">Haute Couture Lookbook</span>
          <span class="black-dot"></span>
        </div>
        <div class="task-widget-time">Autumn / Winter Gala Edition</div>
      </div>

      <!-- Time Pill Widget -->
      <div class="time-pill-widget">
        <span>Curated Runways</span>
        <span class="yellow-dot"></span>
      </div>

      <!-- Vertical Avatar Stack on Right Edge -->
      <div class="avatar-stack-vertical">
        <img src="./images/avatar-client.webp" alt="VIP Member" class="stacked-avatar" />
        <img src="./images/avatar-stylist.webp" alt="Atelier Director" class="stacked-avatar" />
        <img src="./images/avatar-admin.webp" alt="Artisan Designer" class="stacked-avatar" />
      </div>

      <!-- Bottom Left Floating Daily Meeting Card -->
      <div class="daily-meeting-card">
        <div class="meeting-card-head">
          <span class="meeting-card-title">VIP Trunk Show</span>
          <span class="yellow-dot"></span>
        </div>
        <div class="meeting-card-time">02:00pm–04:30pm • Paris Atelier</div>
        <div class="meeting-card-avatars">
          <img src="./images/avatar-client.webp" alt="" />
          <img src="./images/avatar-stylist.webp" alt="" />
          <img src="./images/avatar-admin.webp" alt="" />
        </div>
      </div>

      <!-- Bottom Right Glassmorphism Calendar Pill -->
      <div class="glass-calendar-pill">
        <div class="cal-days-row">
          <span>Sun</span><span>Mon</span><span>Tue</span><span class="cal-active-day">Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
        </div>
        <div class="cal-dates-row">
          <span>23</span><span>24</span><span class="cal-active-day">25</span><span>26</span><span>27</span><span>28</span>
          <span class="cal-stripes" aria-hidden="true"></span>
        </div>
      </div>
    </aside>
  </main>

  <script>
    function togglePasswordVisibility(fieldId, btn) {
      const field = document.getElementById(fieldId);
      if (!field) return;
      const isPass = field.type === 'password';
      field.type = isPass ? 'text' : 'password';
      btn.innerHTML = isPass ? `
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
      ` : `
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
          <line x1="1" y1="1" x2="23" y2="23"></line>
        </svg>
      `;
    }

    function handleSignup(e) {
      e.preventDefault();
      const role = document.getElementById('signup-role-select').value;
      const email = document.getElementById('email').value.trim();
      const pass = document.getElementById('signup-password').value;
      const confirmPass = document.getElementById('confirm-password').value;
      const submitBtn = document.getElementById('signup-submit-btn');

      if (pass !== confirmPass) {
        alert('Passwords do not match. Please verify your password entry.');
        return;
      }

      submitBtn.innerText = 'Redirecting to login...';
      submitBtn.disabled = true;

      // Save user credentials so login can recognize them
      localStorage.setItem('stackly_auth_user', JSON.stringify({
        email: email || 'lingalamanasa123@gmail.com',
        role: role
      }));

      setTimeout(() => {
        window.location.href = './login.html';
      }, 400);
    }

    function socialAuth(provider) {
      alert(`Connecting to ${provider} authentication... Redirecting.`);
      window.location.href = './login.html';
    }
  </script>
</body>
</html>
